<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bulan & Bintang</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <!-- Background -->
        <div class="background"></div>

        <!-- Efek bintang -->
        <div class="star-layer">
            <img src="foto/bintang.png" alt="Bintang">
        </div>

        <!-- Bulan -->
        <img
            src="foto/bulan.png"
            alt="Bulan"
            class="moon"
        >

        <!-- Judul -->
        <div class="game-title">
            BULAN & BINTANG
        </div>

        <!-- Nama adegan -->
        <div class="scene-title" id="sceneTitle">
            Malam Pertama
        </div>

        <!-- Karakter -->
        <div class="character">

            <img
                id="characterImage"
                src="foto/luna.png"
                alt="Luna"
            >

        </div>

        <!-- Dialog -->
        <div class="dialogue-container">

            <div class="character-name" id="characterName">
                Luna
            </div>

            <div class="dialogue-box">

                <p id="dialogue">
                    Malam ini bulan terlihat lebih indah dari biasanya...
                </p>

                <div
                    class="choices"
                    id="choices">
                </div>

                <button
                    id="nextButton"
                    class="next-button">
                    Lanjut ▶
                </button>

            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            ✦ Sebuah kisah di bawah cahaya bulan ✦
        <br>
        <span>created by <a href="github.com/Naufal-bit670" target="black">Naufal-bit670</a></span>
        


    </div>

    <script src="script.js"></script>

</body>
</html>
